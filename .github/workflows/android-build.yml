
name: RSK Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Customer and Agent APK
        run: gradle :customer-app:assembleDebug :agent-app:assembleDebug --stacktrace

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSK-Solutions-Android-APKs
          path: |
            customer-app/build/outputs/apk/debug/*.apk
            agent-app/build/outputs/apk/debug/*.apk
