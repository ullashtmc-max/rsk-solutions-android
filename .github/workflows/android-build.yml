name: RSK Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # উবুন্টু রানারে বিল্ট-ইন অ্যান্ড্রয়েড এসডিকে দিয়ে সরাসরি বিল্ড করা নিরাপদ
      - name: Build Customer and Agent APK
        run: ./gradlew :customer-app:assembleDebug :agent-app:assembleDebug --stacktrace

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSK-Solutions-Android-APKs
          path: |
            customer-app/build/outputs/apk/debug/*.apk
            agent-app/build/outputs/apk/debug/*.apk
