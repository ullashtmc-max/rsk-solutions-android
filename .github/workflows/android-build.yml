name: RSK Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify modules
        run: gradle projects

      - name: Build Customer APK
        run: gradle :customer-app:assembleDebug --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: RSK-Customer-APK
          path: customer-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-agent:
    name: Build Agent APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify modules
        run: gradle projects

      - name: Build Agent APK
        run: gradle :agent-app:assembleDebug --stacktrace

      - name: Upload Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: RSK-Agent-APK
          path: agent-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
