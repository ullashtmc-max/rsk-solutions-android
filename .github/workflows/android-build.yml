name: RSK Android APK Build
​on:
workflow_dispatch:
push:
branches:
- main
​permissions:
contents: read
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout
uses: actions/checkout@v4
​- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
​- name: Setup Gradle
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.11.1'
​- name: Setup Android SDK
uses: android-actions/setup-android@v3
with:
cmdline-tools-version: "12266719"
packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
​- name: Accept SDK Licenses
run: yes | sdkmanager --licenses || true
​- name: Build Customer and Agent APK
run: |
chmod +x gradlew
./gradlew :customer-app:assembleDebug :agent-app:assembleDebug
​- name: Upload APK files
uses: actions/upload-artifact@v4
with:
name: RSK-Solutions-Android-APKs
path: |
customer-app/build/outputs/apk/debug/.apk
agent-app/build/outputs/apk/debug/.apk
