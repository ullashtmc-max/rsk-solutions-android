name: RSK Customer APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Customer debug APK
        run: gradle :customer-app:assembleDebug --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: RSK-Customer-APK
          path: customer-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
